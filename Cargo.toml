[package]
name = "zil"
version = "0.1.0"
edition = "2024"
description = "An expression calculator and scripting language with units, dates, exact fractions and big ints"
repository = "https://github.com/zanbowie138/zil"
readme = "README.md"
keywords = ["calculator", "units", "repl", "scripting", "language"]
categories = ["command-line-utilities", "mathematics"]

[dependencies]
ariadne = "0.6.0"
base64 = "0.23.1"
fastrand = "2.5.0"
indexmap = "2.14.2"
jiff = "0.2.38"
logos = "0.16.1"
md-5 = "0.11.0"
num-bigint = "0.4"
num-integer = "0.1.47"
num-rational = "0.4.2"
num-traits = "0.2.19"
regex = "1.13.1"
rustyline = "18.0.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11.0"
ureq = "3.4.2"

[lints.clippy]
mod_module_files = "deny"
