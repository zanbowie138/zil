name: fuzz
on:
  pull_request:
    paths: [crates/zil/**, fuzz/**]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, eval]
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-fuzz }
      - run: cargo +nightly run --bin seed
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=180
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts
