<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zil sandbox</title>
<meta name="description" content="Run zil, a calculator language with units, dates and exact math, in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="modulepreload" href="pkg/zil.js">
<style>
:root {
  --bg: #f6f5f1; --panel: #fffefb; --sunk: #efede7; --ink: #1d1c1a; --muted: #6e6a62; --faint: #a6a196; --line: #e3e0d8;
  --accent: #c8440f; --accent-ink: #fff; --accent-soft: #fbe9df; --bad: #b42318; --bad-soft: #fdecea;
  --k: #b3420e; --s: #3f7a12; --n: #0f6e76; --f: #2849b8; --u: #8a3aa8; --c: #9b968b;
  --ansi-fg: var(--ink); --ansi-bg: var(--panel);
  --ansi-0: #1d1c1a; --ansi-1: #c4281c; --ansi-2: #3f7a12; --ansi-3: #a86a00; --ansi-4: #2849b8; --ansi-5: #9c2f8f; --ansi-6: #0f6e76; --ansi-7: #6e6a62;
  --ansi-8: #8a857b; --ansi-9: #e0442f; --ansi-10: #58a11e; --ansi-11: #c99400; --ansi-12: #4469e0; --ansi-13: #c044b0; --ansi-14: #1693a0; --ansi-15: #1d1c1a;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  /* Output: Google's Plex Mono subsets lack box drawing and arrows, and fallback glyphs of another width skew boxes. */
  --term: "Cascadia Mono", Menlo, "DejaVu Sans Mono", Consolas, ui-monospace, monospace;
  --shadow: 0 6px 24px rgb(0 0 0 / 0.12), 0 1px 3px rgb(0 0 0 / 0.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312; --panel: #1a1a18; --sunk: #222220; --ink: #ebe9e3; --muted: #9a958b; --faint: #67635b; --line: #2d2c29;
    --accent: #ff7b3f; --accent-ink: #1a0d06; --accent-soft: #3a2116; --bad: #ff7a6b; --bad-soft: #3a1c18;
    --k: #ff9a62; --s: #a5d46a; --n: #5ccfd6; --f: #8fb0ff; --u: #d7a2ef; --c: #6f6b62;
    --ansi-0: #3a3935; --ansi-1: #ff7a6b; --ansi-2: #a5d46a; --ansi-3: #e8c45a; --ansi-4: #8fb0ff; --ansi-5: #e39ad8; --ansi-6: #5ccfd6; --ansi-7: #c9c5bb;
    --ansi-8: #77736b; --ansi-9: #ff9d91; --ansi-10: #c4ec8f; --ansi-11: #f5d97f; --ansi-12: #b3c9ff; --ansi-13: #f0b8e8; --ansi-14: #8ae4e9; --ansi-15: #ffffff;
    --shadow: 0 6px 24px rgb(0 0 0 / 0.5), 0 1px 3px rgb(0 0 0 / 0.4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
kbd { font: 500 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--panel); }

/* top bar */
.bar { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; }
.brand b { font: 600 20px var(--mono); letter-spacing: -0.02em; }
.brand b::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 2px; border-radius: 2px; background: var(--accent); }
.brand span { color: var(--muted); }
.bar nav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.bar nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; }
.bar nav a:hover { color: var(--ink); background: var(--sunk); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 35%, transparent); }
:is(button, input, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.link { border: 0; background: none; padding: 0; font: 500 12px var(--mono); color: var(--accent); text-decoration: underline; cursor: pointer; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); margin: 0; }

/* layout */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 296px minmax(0, 1fr) minmax(0, 1fr); }
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pane + .pane { border-left: 1px solid var(--line); }
.head { display: flex; align-items: center; gap: 10px; height: 48px; flex: none; padding: 0 12px 0 20px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.head .title { font-weight: 500; color: var(--ink); }
.spacer { flex: 1; }

/* left rail: the tour, then the searchable catalog */
.rail { background: var(--bg); }
.search { flex: none; padding: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
.search input:focus-visible { outline-offset: 0; }
.search .btn { padding: 0 10px; }
.paste { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.scroll { flex: 1; overflow: auto; padding: 4px 12px 24px; }
.scroll h3 { margin: 16px 8px 4px; font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
details { border-radius: 7px; }
summary { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; cursor: pointer; list-style: none; font-weight: 500; font-size: 13px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; width: 6px; height: 6px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .12s; margin-right: 2px; }
details[open] > summary::before { transform: rotate(45deg); }
summary:hover { background: var(--sunk); }
summary small { margin-left: auto; color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
details[open] { padding-bottom: 6px; }
.try { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px 6px 22px; border-radius: 7px; cursor: pointer; }
.try:hover { background: var(--sunk); }
.try[aria-current] { background: var(--accent-soft); }
.try > span { display: block; font-size: 13px; }
.try code { display: block; font: 12px/1.5 var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { margin: 16px 8px; color: var(--muted); font-size: 13px; }
.credits { margin: 24px 8px 0; font-size: 12px; color: var(--faint); }
.credits a { color: inherit; }

/* the tour card */
.tour { flex: none; margin: 12px; padding: 14px 16px; border-radius: 10px; background: var(--panel); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--shadow); }
.tour header { display: flex; align-items: center; font-size: 12px; font-weight: 600; color: var(--accent); }
.tour header span { flex: 1; margin-left: 4px; }
.tour header select { font: inherit; color: inherit; background: none; border: 0; border-radius: 5px; padding: 2px 0; cursor: pointer; }
.tour header select:hover { background: var(--sunk); }
.tour .x { border: 0; background: none; font-size: 18px; line-height: 1; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 5px; }
.tour .x:hover { background: var(--sunk); color: var(--ink); }
.tour p { margin: 8px 0 10px; font-size: 13.5px; }
.tour pre { margin: 0 0 12px; padding: 8px 10px; border-radius: 7px; background: var(--sunk); font: 12.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.tour footer { display: flex; gap: 8px; align-items: center; }
.tour footer .btn { height: 28px; font-size: 13px; }
code { font-family: var(--mono); font-size: .92em; }
p code, li code { background: var(--sunk); padding: 1px 4px; border-radius: 4px; }

/* highlighted code outside the editors: the transcript, the catalog, the tour */
.hljs-keyword, .hljs-operator { color: var(--k); } .hljs-string { color: var(--s); } .hljs-number, .hljs-literal { color: var(--n); }
.hljs-title { color: var(--f); } .hljs-type { color: var(--u); }
.hljs-comment, .zil-result { color: var(--c); font-style: italic; }

/* CodeMirror */
.editor { flex: 1; min-height: 0; background: var(--panel); }
.editor .cm-editor { height: 100%; }
.cm-editor { background: transparent; color: var(--ink); }
.cm-editor.cm-focused { outline: none; }
.cm-editor .cm-scroller { font: 13.5px/1.65 var(--mono); }
.editor .cm-content { padding: 16px 0; }
.cm-editor .cm-gutters { background: var(--panel); border: 0; color: var(--faint); }
.cm-editor .cm-lineNumbers .cm-gutterElement { padding: 0 12px 0 16px; }
.cm-editor .cm-activeLine { background: color-mix(in srgb, var(--sunk) 55%, transparent); }
.cm-editor .cm-activeLineGutter { background: transparent; color: var(--muted); }
.cm-editor .cm-cursor { border-left-color: var(--ink); }
.cm-editor .cm-selectionBackground, .cm-editor.cm-focused .cm-selectionBackground { background: color-mix(in srgb, var(--accent) 22%, transparent) !important; }
.cm-editor .cm-matchingBracket { background: color-mix(in srgb, var(--accent) 18%, transparent); outline: none; }
.cm-editor .cm-placeholder { color: var(--faint); }
.zil-inline { margin-left: 2.5em; color: var(--muted); font-style: italic; white-space: pre; }
.zil-inline.bad { color: var(--bad); }
.cm-tooltip { background: var(--panel) !important; color: var(--ink); border: 1px solid var(--line) !important; border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.cm-tooltip .cm-tooltip-arrow { display: none; }
.cm-tooltip-autocomplete > ul { font: 13px/1.5 var(--mono) !important; max-height: 16em; }
.cm-tooltip-autocomplete > ul > li { padding: 2px 10px 2px 6px !important; }
.cm-tooltip-autocomplete > ul > li[aria-selected] { background: var(--accent-soft) !important; color: var(--ink) !important; }
.cm-completionDetail { margin-left: 1em; color: var(--faint); font-style: normal !important; }
.cm-completionMatchedText { text-decoration: none !important; color: var(--accent); font-weight: 500; }
.cm-completionIcon { width: 1.4em !important; opacity: .7 !important; }
.cm-completionIcon-unit::after { content: "u"; color: var(--u); }
.cm-completionIcon-method::after, .cm-completionIcon-function::after { color: var(--f); }
.cm-tooltip.cm-completionInfo { padding: 0 !important; max-width: 360px; }
.zil-doc, .zil-sig { padding: 8px 12px; max-width: 420px; font: 13px/1.5 var(--sans); }
.zil-doc code, .zil-sig div { display: block; font: 12.5px/1.5 var(--mono); color: var(--f); white-space: pre-wrap; }
.zil-sig b { color: var(--accent); font-weight: 600; }
.zil-doc p, .zil-sig p { margin: 4px 0 0; }
.zil-sig p { color: var(--muted); font-size: 12.5px; }
.zil-doc footer { margin-top: 6px; font-size: 12px; color: var(--faint); }

/* output */
.out { flex: 1; overflow: auto; padding: 16px 20px; background: var(--panel); font: 13.5px/1.65 var(--term); }
.out pre { margin: 0; font: inherit; white-space: pre; }
.out .printed + .result, .out .printed + .error { margin-top: 12px; }
.result { display: flex; gap: 10px; }
.result::before { content: "→"; color: var(--accent); font-weight: 500; }
.error { color: var(--ink); background: var(--bad-soft); border-radius: 8px; padding: 12px 14px; overflow: auto; }
.error pre { --ansi-1: var(--bad); }
.note { color: var(--muted); font-family: var(--sans); }
.status { font-variant-numeric: tabular-nums; }
.status.busy::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* mode switch */
.modes { display: inline-flex; gap: 2px; padding: 3px; background: var(--sunk); border-radius: 9px; }
.modes button { border: 0; background: none; padding: 3px 12px; border-radius: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.modes button:hover { color: var(--ink); }
.modes button[aria-selected="true"], .modes button[aria-checked="true"] { background: var(--panel); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
.app:not(.repl) .repl-only, .app.repl .editor-only { display: none; }
.app.repl { grid-template-columns: 296px minmax(0, 1fr); }

/* REPL: a transcript with the prompt as its last line */
.log { flex: 1; overflow: auto; padding: 16px 20px 32px; background: var(--panel); font: 13.5px/1.65 var(--term); cursor: text; }
.log pre { margin: 0; font: inherit; white-space: pre; }
.log a[data-zil] { cursor: pointer; text-decoration: none; border-radius: 3px; }
.log a[data-zil]:hover { background: var(--accent-soft); text-decoration: underline; text-decoration-color: var(--accent); }
.entry { margin-bottom: 12px; }
.entry > * + * { margin-top: 2px; }
.entry .error { margin-top: 6px; }
.line { display: flex; gap: 10px; }
.line > pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.ps { flex: none; color: var(--accent); font-weight: 500; user-select: none; }
.input { flex: 1; min-width: 0; }
.input .cm-scroller { font: 13.5px/1.65 var(--term); }
.input .cm-content { padding: 0; }
.input .cm-line { padding: 0; }
.log .note { margin: 0 0 12px; font-size: 13px; }

@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .rail { grid-column: 1 / -1; grid-row: 2; border-top: 1px solid var(--line); max-height: 40vh; }
  .pane + .pane { border-left: 1px solid var(--line); }
  .rail.pane { border-left: 0; }
  .app.repl { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  body { height: auto; }
  .bar { padding: 10px 16px; flex-wrap: wrap; }
  .brand span { display: none; }
  .app { display: flex; flex-direction: column; }
  .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
  .editor { min-height: 46vh; }
  .out { min-height: 28vh; }
  .log { min-height: 60vh; }
  .rail { order: 3; max-height: none; }
  .rail:has(.tour:not([hidden])) { order: 0; }
  .head { padding-left: 16px; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { .status.busy::before { animation: none; } summary::before { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="./"><b>zil</b><span>sandbox</span></a>
  <div class="modes" id="modes" role="tablist" aria-label="Mode">
    <button role="tab" data-mode="repl" aria-selected="true">REPL</button>
    <button role="tab" data-mode="editor" aria-selected="false">Script</button>
  </div>
  <nav>
    <a href="docs/">Docs</a>
    <a href="https://github.com/zanbowie138/zil">GitHub</a>
  </nav>
</header>

<main class="app">
  <aside class="rail pane" aria-label="Examples">
    <div class="search">
      <input type="search" id="find" placeholder="Search examples" aria-label="Search examples" aria-keyshortcuts="/">
      <button class="btn" id="tour-start" title="A five-minute walk through the language">Tour</button>
    </div>
    <div class="paste editor-only">
      <span id="paste-label">Examples</span>
      <div class="modes" id="paste" role="radiogroup" aria-labelledby="paste-label">
        <button role="radio" data-paste="append" aria-checked="true" title="Add the example after the cursor">Append</button>
        <button role="radio" data-paste="replace" aria-checked="false" title="Replace the whole script with the example">Replace</button>
      </div>
    </div>
    <div class="tour" id="tour" hidden aria-live="polite"></div>
    <div class="scroll">
      <div id="catalog"><p class="empty">Loading examples…</p></div>
      <p class="empty" id="nohits" hidden>No examples match. Try <code>help("…")</code> in the REPL to search every function.</p>
      <p class="credits">City and country data from <a href="https://www.geonames.org/">GeoNames</a> (<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>). Editor by <a href="https://codemirror.net/">CodeMirror</a> (MIT).</p>
    </div>
  </aside>

  <section class="pane editor-only">
    <div class="head">
      <span class="title">Editor</span>
      <label class="toggle" title="Run as you type"><input type="checkbox" id="live" checked> Live</label>
      <span class="spacer"></span>
      <button class="btn" id="share" title="Copy a link to this code">Share</button>
      <button class="btn primary" id="run">Run <kbd class="hide-sm" id="key">Ctrl ↵</kbd></button>
    </div>
    <div class="editor" id="editor"></div>
  </section>

  <section class="pane editor-only">
    <div class="head">
      <span class="title">Output</span>
      <span class="spacer"></span>
      <span class="status" id="status" role="status"></span>
    </div>
    <div class="out" id="out" aria-live="polite"><p class="note">Loading zil…</p></div>
  </section>

  <section class="pane repl-only" aria-label="REPL">
    <div class="head">
      <span class="title">REPL</span>
      <span class="hide-sm"><kbd>Tab</kbd> complete · <kbd>↑</kbd> <kbd>↓</kbd> history · <kbd>Shift ↵</kbd> new line · <kbd>Ctrl L</kbd> clear</span>
      <span class="spacer"></span>
      <span class="status" id="rstatus" role="status"></span>
      <button class="btn" id="reset" title="Forget every variable and start over">Reset</button>
    </div>
    <div class="log" id="log" aria-live="polite">
      <div class="line" id="prompt">
        <span class="ps" aria-hidden="true">›</span>
        <div class="input" id="input"></div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
