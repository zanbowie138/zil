[package]
name = "zil-cli"
description = "The zil command line: a REPL and script runner for the zil calculator language"
readme = "../../README.md"
keywords = ["calculator", "units", "repl", "scripting", "language"]
categories = ["command-line-utilities", "mathematics"]
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "zil"
path = "src/main.rs"

[dependencies]
zil = { path = "../zil", version = "0.3.0" }
crossterm = "0.29.0"
jiff = "0.2.38"
rustyline = "18.0.1"
terminal_size = "0.4.4"
ctrlc = "3.5.2"

[build-dependencies]
winresource = "0.1.31"

[lints]
workspace = true
